<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CabEase - Cab Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .hero {
            background: linear-gradient(135deg, #111827, #374151);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 18px;
            color: #d1d5db;
        }

        .booking-container {
            max-width: 900px;
            margin: -35px auto 40px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            position: relative;
        }

        .booking-container h2 {
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #d97706;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .cabs-section {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .cabs-section h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .cab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .cab-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cab-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .cab-card h3 {
            margin-bottom: 8px;
        }

        .cab-card p {
            color: #6b7280;
            margin: 5px 0;
        }

        .available {
            color: #16a34a !important;
            font-weight: bold;
        }

        footer {
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 32px;
            }

            nav {
                display: none;
            }

            .booking-container {
                margin: -20px 15px 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🚕 CabEase</div>

    <nav>
        <a href="/">Home</a>
        <a href="#cabs">Available Cabs</a>
        <a href="#booking">Book Now</a>
    </nav>
</header>

<section class="hero">
    <h1>Your Ride, Your Way</h1>
    <p>Book a comfortable cab quickly and easily.</p>
</section>

<section class="booking-container" id="booking">

    <h2>🚕 Book Your Cab</h2>

    <form id="bookingForm">

        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="form-group">
            <label for="cabSelect">Select Cab</label>

            <select id="cabSelect" required>
                <option value="">Loading cabs...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="distance">Distance (km)</label>

            <input
                type="number"
                id="distance"
                placeholder="Enter distance"
                min="1"
                required
            >
        </div>

        <button type="submit">
            Book Cab
        </button>

    </form>

    <div id="message" class="message"></div>

</section>

<section class="cabs-section" id="cabs">

    <h2>Available Cabs</h2>

    <div class="cab-grid" id="cabGrid">
        <p>Loading available cabs...</p>
    </div>

</section>

<footer>
    <p>© 2026 CabEase | Simple Cab Booking System</p>
</footer>


<script>

    let availableCabs = [];

    // Load available cabs
    async function loadCabs() {

        try {

            const response = await fetch('/cabs');

            availableCabs = await response.json();

            const select = document.getElementById('cabSelect');
            const grid = document.getElementById('cabGrid');

            select.innerHTML =
                '<option value="">Select a cab</option>';

            grid.innerHTML = '';

            availableCabs.forEach(cab => {

                // Add to dropdown
                const option = document.createElement('option');

                option.value = cab.id;

                option.textContent =
                    `${cab.driver} - ${cab.type} (₹${cab.farePerKm}/km)`;

                select.appendChild(option);


                // Add cab card
                const card = document.createElement('div');

                card.className = 'cab-card';

                card.innerHTML = `
                    <div class="cab-icon">🚕</div>

                    <h3>${cab.type}</h3>

                    <p><strong>Driver:</strong> ${cab.driver}</p>

                    <p><strong>Fare:</strong> ₹${cab.farePerKm}/km</p>

                    <p class="available">● Available</p>
                `;

                grid.appendChild(card);

            });

        } catch (error) {

            console.error(error);

            document.getElementById('cabGrid').innerHTML =
                '<p>Unable to load cabs.</p>';
        }
    }


    // Book cab
    document
        .getElementById('bookingForm')
        .addEventListener('submit', async function(event) {

            event.preventDefault();

            const customerName =
                document.getElementById('customerName').value;

            const cabId =
                Number(document.getElementById('cabSelect').value);

            const distance =
                Number(document.getElementById('distance').value);

            const message =
                document.getElementById('message');


            try {

                const response = await fetch('/book', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        cabId,
                        customerName,
                        distance
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    message.className = 'message error';

                    message.style.display = 'block';

                    message.textContent =
                        data.error;

                    return;
                }


                message.className = 'message success';

                message.style.display = 'block';

                message.innerHTML =
                    `✅ Cab booked successfully! 
                     Booking ID: ${data.bookingId} 
                     | Fare: ₹${data.fare}`;


                document.getElementById('bookingForm').reset();


                // Refresh available cabs
                loadCabs();

            } catch (error) {

                message.className = 'message error';

                message.style.display = 'block';

                message.textContent =
                    'Something went wrong. Please try again.';
            }

        });


    // Load cabs when page opens
    loadCabs();

</script>

</body>
</html>
